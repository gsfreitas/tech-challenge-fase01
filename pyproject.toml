[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-challenge-fase01"
version = "0.1.0"
description = "Predição de churn end-to-end: EDA, baselines, MLP PyTorch e API FastAPI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

authors = [
    { name = "Grupo 2 - 9MLET FIAP" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = ["churn", "machine-learning", "mlp", "fastapi", "mlflow"]

dependencies = [
    # Data & ML stack
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "scipy>=1.17.1",
    "joblib>=1.3,<2.0",
    # MLP
    "torch>=2.0,<3.0",
    # MLflow tracking + registry
    "mlflow>=3.11.1",
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyjwt>=2.8,<3.0",
    # Notebooks (mantido pra reprodutibilidade dos relatórios)
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.15,<4.0",
    "httpx>=0.27,<1.0",
    "pandera>=0.20,<1.0",
    "ruff>=0.1,<1.0",
]

[project.urls]
Homepage = "https://github.com/gsfreitas/tech-challenge-fase01"
Documentation = "https://github.com/gsfreitas/tech-challenge-fase01#readme"
Repository = "https://github.com/gsfreitas/tech-challenge-fase01"
Issues = "https://github.com/gsfreitas/tech-challenge-fase01/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: marks unit tests (fast)",
    "integration: marks integration tests (medium)",
    "api: marks API tests (requires app)",
    "slow: marks slow tests",
]

# ─────────────────────────────────────────────────────────────
# coverage
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "src/api/main.py",
    "src/__init__.py",
    "src/*/__init__.py",
    "src/training/train.py",
    "src/training/train_mlp.py",
    "src/training/compare_models.py",
    "src/analysis/cost_analysis.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ─────────────────────────────────────────────────────────────
# ruff
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "mlruns", "models", "data", "notebooks", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]